<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin Login - Celestial Minimalist</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;family=DM+Sans:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#0F172A",
                        background: {
                            DEFAULT: "#F8FAFC",
                            light: "#F8FAFC",
                            dark: "#0F172A",
                        },
                        surface: "#FFFFFF",
                        text: "#334155",
                        muted: "#CBD5E1",
                        accent: "#38BDF8",
                    },
                    fontFamily: {
                        display: ["'Cormorant Garamond'", "serif"],
                        body: ["'DM Sans'", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "4px",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },
                    boxShadow: {
                        glow: "0 10px 40px -10px rgba(56, 189, 248, 0.1)",
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: theme('colors.background.DEFAULT');
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Cormorant Garamond', serif;
        }
    </style>
</head>
<body class="min-h-screen bg-background text-text flex items-center justify-center p-4 selection:bg-accent selection:text-white">
<!-- Admin Login -->
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col justify-center items-center">
<div class="w-full max-w-[400px] bg-surface rounded shadow-glow border border-muted/30 p-8 relative overflow-hidden">
<!-- Subtle Gradient Effect Background -->
<div class="absolute inset-0 bg-gradient-to-br from-[#E0F2FE] to-surface opacity-30 z-0 pointer-events-none"></div>
<div class="relative z-10 flex flex-col">
<h1 class="text-primary text-[32px] font-semibold leading-tight tracking-[-0.015em] text-center pb-6">Staff Access</h1>
<form class="flex flex-col gap-5">
<div class="flex flex-col gap-2">
<label class="sr-only" for="admin-password">Password</label>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded text-text focus:outline-0 focus:ring-1 focus:ring-accent focus:border-accent border border-muted bg-surface h-12 placeholder:text-muted p-4 text-base font-normal leading-normal transition-colors duration-200" id="admin-password" name="admin-password" placeholder="Enter Access Key" type="password" value=""/>
</div>
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded h-12 px-5 bg-primary text-white text-[14px] font-medium leading-normal tracking-wide transition-all duration-200 hover:bg-primary/90 focus:ring-2 focus:ring-accent focus:ring-offset-2 focus:outline-none" type="button">
<span class="truncate">Enter Dashboard</span>
</button>
</form>
<!-- Example Error State (Hidden by default, used for illustration of requirements) -->
<!-- 
                    <div class="mt-4 text-center">
                        <p class="text-[#EF4444] text-sm font-medium">Invalid Key</p>
                    </div>
                    -->
</div>
</div>
<!-- Decorative footer text -->
<div class="mt-8 text-center text-muted text-sm font-medium tracking-widest uppercase relative z-10">
                Worship &amp; Warfare Night
            </div>
</div>
</div>
</body></html>
